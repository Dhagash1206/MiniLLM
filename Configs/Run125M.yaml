# Main run: ~110M params (tied embeddings), 2.5B tokens on Kaggle 2x T4.
# One file drives pretrain, SFT and DPO; each script reads its own section.
# ${HF_USERNAME} is expanded from the environment.

model:
  vocab_size: 32768
  dim: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 12
  ffn_hidden_dim: 2048
  max_seq_len: 1024
  rope_theta: 10000.0
  tie_embeddings: true
  gradient_checkpointing: false  # ~7 GB/T4 at micro-batch 8; turning it on costs ~33% more compute

data:
  tokens_dir: data/tokens
  hub_repo: ${HF_USERNAME}/minillm-tokens
  tokenizer_dir: data/tokens/tokenizer
  seed: 1234

train:
  total_tokens: 2500000000
  micro_batch_size: 8           # per GPU; check train/peak_mem_gb before raising it
  tokens_per_step: 524288       # 8 x 1024 x 2 GPUs x 32 accumulation steps
  max_lr: 6.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 250
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 250
  eval_batches: 40
  log_interval: 10
  sample_interval: 500
  checkpoint_interval: 250      # ~45 min on 2x T4
  max_runtime_hours: 11.25      # Kaggle kills sessions at 12h
  checkpoint_dir: checkpoints
  keep_checkpoints: 2           # newest full step-XXXXX/ checkpoints (~1.3 GB each)
  milestone_interval: 1000      # fp16 weights-only versions kept forever (~0.22 GB each)
  loss_spike_threshold: 0.5     # skip saving while the loss is NaN or this far above its average
  compile: false

hub:
  checkpoint_repo: ${HF_USERNAME}/minillm-125m-ckpt
  push_checkpoints: true
  private: true
  squash_history: true

wandb:
  enabled: true
  project: minillm
  run_name: minillm-125m

sft:
  init_checkpoint: hub:${HF_USERNAME}/minillm-125m-ckpt:pretrain/latest
  output_dir: checkpoints/sft
  epochs: 2
  micro_batch_size: 16
  grad_accum_steps: 4
  max_lr: 6.0e-5
  warmup_steps: 100
  max_seq_len: 1024
  datasets:                     # samples = examples kept after the 1024-token filter (0 = all)
    - {name: HuggingFaceTB/smol-smoltalk, split: train, samples: 200000}
    - {name: ise-uiuc/Magicoder-OSS-Instruct-75K, split: train, samples: 0}
  lora_enabled: false           # true = LoRA (r=16) instead of full fine-tuning

dpo:
  init_checkpoint: hub:${HF_USERNAME}/minillm-125m-ckpt:sft/latest
  output_dir: checkpoints/dpo
  dataset: HuggingFaceH4/ultrafeedback_binarized
  split: train_prefs
  max_pairs: 20000
  beta: 0.1
  epochs: 1
  micro_batch_size: 4
  grad_accum_steps: 8
  max_lr: 2.0e-6
  lora_enabled: false
